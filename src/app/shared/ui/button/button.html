@if (routerLink()) {
  <a [routerLink]="routerLink()" [class]="classes()"><ng-content /></a>
} @else if (href()) {
  <a [href]="href()" [attr.download]="download() ? '' : null" [attr.target]="download() ? null : '_blank'" [attr.rel]="download() ? null : 'noopener noreferrer'" [class]="classes()"><ng-content /></a>
} @else {
  <button [class]="classes()"><ng-content /></button>
}
