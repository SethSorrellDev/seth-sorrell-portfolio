<a *ngIf="routerLink(); else hrefOrButton" [routerLink]="routerLink()" [fragment]="fragment()" [class]="classes()"><ng-content /></a>
<ng-template #hrefOrButton>
  <a *ngIf="href(); else plainButton" [href]="href()" [attr.download]="download() ? '' : null" [attr.target]="download() ? null : '_blank'" [attr.rel]="download() ? null : 'noopener noreferrer'" [class]="classes()"><ng-content /></a>
  <ng-template #plainButton>
    <button [class]="classes()"><ng-content /></button>
  </ng-template>
</ng-template>
