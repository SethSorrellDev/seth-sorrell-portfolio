<main class="min-h-screen bg-paper text-ink dark:bg-ink dark:text-paper transition-colors duration-300 px-6 py-24">
  <div class="max-w-3xl mx-auto">
    @if (project(); as p) {
      <span class="font-mono text-sm text-slate">case study — coming in Phase 5</span>
      <h1 class="font-display text-4xl md:text-5xl font-bold mt-3 mb-4">{{ p.name }}</h1>
      <p class="font-body text-lg text-slate">{{ p.tagline }}</p>
    } @else {
      <p class="font-mono text-sm text-slate">No project found for slug: {{ slug() }}</p>
    }
  </div>
</main>
