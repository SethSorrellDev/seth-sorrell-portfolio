<section id="credentials" class="max-w-6xl mx-auto px-6 py-24 md:py-32 border-t border-slate/10">
  <span class="font-mono text-sm text-slate">credentials</span>
  <h2 class="font-display text-3xl md:text-4xl font-bold mt-3 mb-12 text-ink dark:text-paper">Building the paper trail alongside the code</h2>

  <div class="grid sm:grid-cols-2 gap-6">
    @for (item of credentials; track item.name; let i = $index) {
      <app-card class="block" [appScrollReveal]="i * 100">
        <div class="flex items-start justify-between gap-4 mb-2">
          <h3 class="font-display text-lg font-bold text-ink dark:text-paper">{{ item.name }}</h3>
          <app-badge [tone]="item.tone">{{ item.status }}</app-badge>
        </div>
        <p class="font-mono text-xs text-slate">{{ item.issuer }}</p>
      </app-card>
    }
  </div>
</section>
